server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: workspace-app-backend
  
  data:
    mongodb:
      # MongoDB Atlas Cloud Database
      # Set MONGODB_URI environment variable for production
      uri: ${MONGODB_URI:mongodb+srv://palsamarth9:sama.1234@cluster0.4yyhdbj.mongodb.net/workspace-app?retryWrites=true&w=majority&appName=Cluster0&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000&maxPoolSize=50&maxIdleTimeMS=120000&maxLifeTimeMS=300000}
      # Local fallback (commented out):
      # uri: mongodb://localhost:27017/workspace-app
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  # Set JWT_SECRET environment variable for production
  secret: ${JWT_SECRET:WorkspaceAppSecretKeyForJWTToken2023ExtraLongSecureKeyForHS512AlgorithmCompliance2024}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    com.workspace.app: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO

# WebSocket Configuration
websocket:
  allowed-origins: http://localhost:3000

# VideoSDK Configuration
videosdk:
  # Set VIDEOSDK_API_KEY and VIDEOSDK_SECRET environment variables for production
  apiKey: ${VIDEOSDK_API_KEY:1616b563-d1e0-4b0b-8c7e-57080cb264c4}
  secret: ${VIDEOSDK_SECRET:eb5df45a66c37d3e049582c31c83d755282cf32224324af54557561551be906e}
